<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Contatos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Agenda de Contatos</h1>
    <p class="subtitle">Projeto Web com Firebase Firestore</p>

    <form id="contactForm">
      <input type="hidden" id="contactId" />

      <label>Nome</label>
      <input type="text" id="name" placeholder="Digite o nome" required />

      <label>Telefone</label>
      <input type="text" id="phone" placeholder="Digite o telefone" required />

      <label>E-mail</label>
      <input type="email" id="email" placeholder="Digite o e-mail" required />

      <label>Observação</label>
      <textarea id="note" placeholder="Digite uma observação"></textarea>

      <button type="submit" id="saveBtn">Salvar contato</button>
      <button type="button" id="cancelBtn" class="cancel">Cancelar edição</button>
    </form>

    <section>
      <h2>Contatos cadastrados</h2>
      <div id="contactsList" class="contacts-list"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
